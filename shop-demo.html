<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fern &amp; Thistle checkout (release candidate)</title>
<style>
  body { font: 16px/1.5 system-ui, sans-serif; margin: 0; color: #1c1c1c; background: #fafaf7 }
  header { display: flex; justify-content: space-between; padding: 12px 16px; background: #1f3d2b; color: #fff }
  h1 { font-size: 20px; margin: 0 } h2 { font-size: 18px }
  main { max-width: 760px; margin: 0 auto; padding: 0 16px 48px }
  .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px }
  .card { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 12px }
  button { font: inherit; padding: 8px 14px; border: 0; border-radius: 6px; background: #1f3d2b; color: #fff; cursor: pointer }
  button.link { background: none; color: #1f3d2b; text-decoration: underline; padding: 0 }
  button:disabled { opacity: .5 }
  input, select { font: inherit; padding: 8px; border: 1px solid #aaa; border-radius: 6px; outline: none }
  .row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap }
  .err { color: #c00; margin: 4px 0 }
  .ok { color: #070 }
  #summary { width: 420px; border-collapse: collapse; white-space: nowrap }
  #summary td { padding: 4px 8px; border-bottom: 1px solid #eee } #summary td:last-child { text-align: right }
  #toast { position: fixed; bottom: 16px; left: 16px; background: #333; color: #fff; padding: 10px 14px; border-radius: 6px }
</style>
</head>
<body>
<header><h1>Fern &amp; Thistle</h1><span id="badge">Cart (0)</span></header>
<main>
  <p>Checkout by Kerbwise</p>
  <h2>Shop</h2>
  <div class="products" id="shop"></div>

  <h2>Your cart</h2>
  <div id="cart"></div>

  <h2>Checkout</h2>
  <div id="checkout">
    <div class="row"><input id="name" placeholder="Full name" autocomplete="name"></div>
    <div class="row"><input id="phone" placeholder="Mobile number (for delivery updates)" inputmode="tel"></div>
    <div class="row">
      <select id="region"><option value="london">London</option><option value="manchester">Manchester</option><option value="other">Rest of the UK</option></select>
    </div>
    <div class="row"><input id="promo" placeholder="Promo code"><button id="apply" type="button">Apply</button></div>
    <div id="promoMsg"></div>
    <table id="summary"></table>
    <div class="row"><button id="pay" type="button">Pay now</button></div>
    <div id="error" class="err"></div>
  </div>

  <div id="confirm"></div>
</main>
<div id="toast" hidden></div>

<script>
const PRODUCTS = [
  { id: 'hamper', name: 'Gift hamper', price: 90, stock: 3 },
  { id: 'candle', name: 'Scented candle', price: 25, stock: 40 },
  { id: 'tea', name: 'Loose leaf tea', price: 15.5, stock: 100 },
  { id: 'bouquet', name: 'Peony bouquet', price: 120, stock: 5 },
  { id: 'scarf', name: 'Wool scarf', price: 65.9, stock: 12 },
]
const REGIONS = { london: { fee: 20 }, manchester: { fee: 15 }, other: { fee: 35 } }
const $ = (id) => document.getElementById(id)
const product = (id) => PRODUCTS.find((p) => p.id === id)
const load = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch (e) { return d } }
let cart = load('cart', [])
let codes = []
let feeShown = null

function save() { localStorage.setItem('cart', JSON.stringify(cart)) }

function renderShop() {
  $('shop').innerHTML = PRODUCTS.map((p) =>
    `<div class="card"><strong>${p.name}</strong><div>£${p.price.toFixed(2)}</div><div>${p.stock} in stock</div><button type="button" onclick="add('${p.id}')">Add to cart</button></div>`
  ).join('')
}

function add(id) {
  const line = cart.find((l) => l.id === id)
  const have = line ? line.qty : 0
  if (have + 1 > product(id).stock) { toast('Only ' + product(id).stock + ' left'); return }
  if (line) line.qty += 1; else cart.push({ id, qty: 1 })
  save(); render()
}

function setQty(id, value) {
  const line = cart.find((l) => l.id === id)
  line.qty = Number(value)
  save(); render()
}
function remove(id) { cart = cart.filter((l) => l.id !== id); save(); render() }

function renderCart() {
  $('badge').textContent = 'Cart (' + cart.length + ')'
  if (!cart.length) { $('cart').innerHTML = '<p>Your cart is empty.</p>'; return }
  $('cart').innerHTML = cart.map((l) => {
    const p = product(l.id)
    return `<div class="row"><span>${p.name}</span><input type="number" value="${l.qty}" style="width:70px" onchange="setQty('${l.id}', this.value)"><span>£${(p.price * l.qty).toFixed(2)}</span><button class="link" type="button" onclick="remove('${l.id}')">Remove</button></div>`
  }).join('')
}

function totals() {
  const sub = cart.reduce((s, l) => s + product(l.id).price * l.qty, 0)
  let discount = 0
  for (const c of codes) {
    if (c === 'WELCOME10') discount += (sub - discount) * 0.1
    if (c === 'THISTLE20' && sub >= 200) discount += 20
  }
  if (!codes.length) feeShown = REGIONS[$('region').value].fee
  if (feeShown === null) feeShown = REGIONS[$('region').value].fee
  const fee = sub >= 300 ? 0 : feeShown
  return { sub, discount, fee, total: sub - discount + fee }
}

function renderSummary() {
  const t = totals()
  $('summary').innerHTML =
    `<tr><td>Subtotal</td><td>£${t.sub.toFixed(2)}</td></tr>` +
    `<tr><td>Discount</td><td>- £${t.discount.toFixed(2)}</td></tr>` +
    `<tr><td>Delivery</td><td>£${t.fee.toFixed(2)}</td></tr>` +
    `<tr><td><strong>Total</strong></td><td><strong>£${t.total.toFixed(2)}</strong></td></tr>`
}

function render() { renderCart(); renderSummary() }

$('region').addEventListener('change', renderSummary)
$('apply').addEventListener('click', () => {
  const code = $('promo').value
  if (code !== 'WELCOME10' && code !== 'THISTLE20') { $('promoMsg').innerHTML = '<div class="err">Invalid code</div>'; return }
  codes.push(code)
  $('promoMsg').innerHTML = '<div class="ok">Code applied: ' + code + '</div>'
  renderSummary()
})

function toast(msg) {
  const el = $('toast'); el.textContent = msg; el.hidden = false
  setTimeout(() => { el.hidden = true }, 2500)
}

$('pay').addEventListener('click', () => {
  const name = $('name').value
  const phone = $('phone').value
  const err = $('error')
  err.textContent = ''
  if (!cart.length) { err.textContent = 'Your cart is empty.'; return }
  if (!name) { err.textContent = 'Enter your name.'; return }
  if (!/^07\d{9}$/.test(phone)) { err.textContent = 'Enter a valid phone number.'; return }
  const t = totals()
  if (t.sub < 50) { err.textContent = 'The minimum order is £50.'; return }

  const no = 1001 + Number(localStorage.getItem('orders') || 0)
  const order = { no, name, items: cart.map((l) => ({ ...l })), total: Math.floor(t.total * 100) / 100, status: 'paid' }
  const all = load('orderList', []); all.push(order); localStorage.setItem('orderList', JSON.stringify(all))
  for (const l of cart) product(l.id).stock -= l.qty

  $('confirm').innerHTML =
    `<h2>Thank you, ${name}!</h2><p>Order #${order.no} · status: ${order.status}</p>` +
    `<ul>${order.items.map((l) => `<li>${l.qty} × ${product(l.id).name}</li>`).join('')}</ul><p>Total: GBP ${order.total.toFixed(2)}</p>`

  setTimeout(() => {
    localStorage.setItem('orders', String(Number(localStorage.getItem('orders') || 0) + 1))
    if (phone.endsWith('0')) toast('Payment declined. Please try again.')
    cart = []; codes = []; save(); renderShop(); render()
  }, 1200)
})

renderShop(); render()
</script>
</body>
</html>
